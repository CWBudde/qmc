name: Statistical validation

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      full_race:
        description: Also run the expensive full-suite race audit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: statistics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  statistical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, "386"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-version
          cache: true
      - uses: extractions/setup-just@v2
      - name: Full ordinary suite
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          if [ "$GOARCH" = "amd64" ]; then
            just test
          else
            just test-statistical
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: statistical-coverage
          path: coverage.html

  full-race:
    if: github.event_name == 'workflow_dispatch' && inputs.full_race
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-version
          cache: true
      - uses: extractions/setup-just@v2
      - run: just test-race-statistical
