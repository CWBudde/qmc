name: Statistical validation

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      full_race:
        description: Also run the expensive full-suite race audit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: statistics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  statistical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, "386"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/go-version
          cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: "1.21.0"
      - name: Full ordinary suite
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          if [ "$GOARCH" = "amd64" ]; then
            just test
          else
            just test-statistical
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.arch == 'amd64'
        with:
          name: statistical-coverage
          path: coverage.html

  full-race:
    if: github.event_name == 'workflow_dispatch' && inputs.full_race
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/go-version
          cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: "1.21.0"
      - run: just test-race-statistical
