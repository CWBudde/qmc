name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-version
          cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Set up Node for pinned formatting tools
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install formatters
        run: just setup-deps

      - name: Verify tool installation contracts
        run: just test-tool-setup

      - name: Check formatting
        run: just check-formatted

      - name: Verify required formatter failure gates
        run: just test-formatting

      - name: Check go.mod is tidy
        run: just check-tidy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-version
          cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Set up Node for development tools
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned development tools
        run: just setup-deps

      - name: Lint both modules
        run: just lint lint-wasm-demo

  test:
    name: Test (go ${{ matrix.go-version }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.23", "1.24", "1.25", "1.26.1"]
        # The 386 leg is not padding. This package computes prime bases with an
        # i*i that overflows a 32-bit int, and the sequence a caller gets would
        # differ by architecture if it regressed. That bug is invisible on
        # amd64: TestSieveIsArchitectureIndependent passes there whether or not
        # the guard is present, so until something ran on a 32-bit target the
        # test was not a check, it was decoration.
        #
        # 386 binaries run natively on an amd64 runner with CGO_ENABLED=0, so
        # this costs a job, not an emulator.
        arch: [amd64, "386"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Vet supported architecture
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Check demo compatibility with this Go version
        run: just check-wasm-demo

      # -race needs cgo and a 64-bit target, so the 32-bit leg goes without it.
      # It is not there for the race detector; it is there so the sieve runs
      # where its overflow can actually happen.
      - name: Run tests
        run: |
          if [ "${{ matrix.arch }}" = "386" ]; then
            CGO_ENABLED=0 GOARCH=386 just test-fast
          else
            just test-race
          fi

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real browser behavior uses the deliberate publishing toolchain; the
    # compatibility matrix separately compiles/vets the nested module.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/go-version
          cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Check the WebAssembly demo builds
        run: just check-wasm-demo

      - name: Verify read-only module gates
        run: just test-module-gates

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Verify the demo in Chrome
        run: just test-browser

      # This compile-only backend check complements real-browser js/wasm runs.
      # wasm uses a 64-bit int; the matrix's executable 386 tests cover 32-bit
      # overflow instead of treating a wasm build as evidence for that target.
      - name: Build the library for wasip1/wasm
        env:
          GOOS: wasip1
          GOARCH: wasm
        run: go build ./... && go test -c -o /dev/null .
