name: Release validation

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate (for example, 0.4.0 or 0.4.0-rc.1)
        required: true
        type: string
      reviewed_commit:
        description: Full commit SHA explicitly reviewed for this candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the workflow event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go-version
          cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.21.0"

      - name: Resolve version and verify reviewed source
        id: version
        env:
          QMC_RELEASE_EVENT: ${{ github.event_name }}
          QMC_RELEASE_INPUT_VERSION: ${{ inputs.version }}
          QMC_RELEASE_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          QMC_RELEASE_REF: ${{ github.ref }}
          QMC_RELEASE_EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/release-policy.py --workflow

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pinned development tools
        run: just setup-deps

      - name: Run shared release checks
        env:
          QMC_RELEASE_EXPECTED_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          REVIEWED_COMMIT: ${{ steps.version.outputs.reviewed_commit }}
        run: just release-check "$RELEASE_VERSION" "$REVIEWED_COMMIT"
