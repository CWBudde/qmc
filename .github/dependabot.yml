# Dependabot configuration — https://docs.github.com/code-security/dependabot
version: 2

updates:
  # SHA-pinned actions retain same-line version comments for reviewed updates.
  # Both Go modules are dependency-free; no gomod updater is needed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
